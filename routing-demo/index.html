<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>MapTiler SDK — Routing demo</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <style>
      html,
      body,
      #map {
        margin: 0;
        padding: 0;
        width: 100vw;
        height: 100vh;
      }
    </style>

    <!--
      1. Load the SDK's script and stylesheet.

      Routing hasn't shipped to the CDN yet — it only exists on this branch —
      so this points at a local build instead of the usual CDN URL. Build it
      once from the repo root before opening this file:

        npm run build-umd && npm run build-css

      Once routing ships in a release, swap these two lines back for:
        <script src="https://cdn.maptiler.com/maptiler-sdk-js/<VERSION>/maptiler-sdk.umd.min.js"></script>
        <link href="https://cdn.maptiler.com/maptiler-sdk-js/<VERSION>/maptiler-sdk.css" rel="stylesheet" />
    -->
    <script src="../build/maptiler-sdk.umd.min.js"></script>
    <link href="../build/maptiler-sdk.css" rel="stylesheet" />
  </head>

  <body>
    <div id="map"></div>

    <script>
      // 2. Set your MapTiler Cloud API key.
      // Get a free one at https://cloud.maptiler.com/account/keys/
      maptilersdk.config.apiKey = "WygPUKci70HK9KcjM1sj";

      // 3. Create the map.
      const map = new maptilersdk.Map({
        container: "map",
        center: [8.5417, 47.3769], // Zurich
        zoom: 11,
      });

      // 4. Add the routing control. Note the `maptilersdk.` prefix here: this
      // page has no bundler, so the SDK is a global rather than an import —
      // `new MaptilerRoutingControl(...)` alone would throw a ReferenceError.
      const control = new maptilersdk.MaptilerRoutingControl({
        waypoints: [[8.5417, 47.3769], [12.8724, 50.2329]],
        alternates: 2,
        theme: "light",
      });
      map.addControl(control, "top-right");
    </script>
  </body>
</html>
